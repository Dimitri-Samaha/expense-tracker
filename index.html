<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <div id="header">
        <h1>Expense Tracker</h1>
        <h3>Add a new item:</h3>
    </div>
    <div id="form">
        <div id="upper-form">
            Name: 
            <input id="name" type="text" name="name" placeholder="Where was the expense made?">
        </div>

        <div id="lower-form">
            Date:
            <input id="date" type="date" name="date" placeholder="dd/mm/yyy">
            Amount:
            <input id="amount" type="text" name="amount" placeholder="">
        </div>  

        <input id="add-button" type="button" value="Add">
    </div>

    <div>
        <table id="table">
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Amount</th>
                <th width=50px></th>
            </tr>
        </table>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
